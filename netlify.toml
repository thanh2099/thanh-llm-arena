# Netlify Configuration for Thanh'S LLM Arena

[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://thanh-llm-arena.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page application fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

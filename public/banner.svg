  <line x1="24" y1="42" x2="936" y2="42" stroke="#27272a" stroke-width="1"/>
  <circle cx="36" cy="26" r="3.5" fill="#10b981"/>
  <text x="48" y="30" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.08em">THANH'S LLM ARENA // SYSTEM STATUS: ACTIVE</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18181c" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="220" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <rect width="960" height="220" rx="8" fill="url(#grid)"/>


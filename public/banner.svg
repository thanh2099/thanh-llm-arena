    <rect x="102" y="0" width="138" height="24" rx="4" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="171" y="16" text-anchor="middle" fill="#fafafa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">DEEPSEEK V4.1 FLASH</text>

    <rect x="250" y="0" width="108" height="24" rx="4" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="304" y="16" text-anchor="middle" fill="#fafafa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">GLM-5.3 FLASH</text>

